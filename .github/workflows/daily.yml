name: Daily football forecasts
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Lisbon
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: football-edge-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: data/forecasts.sqlite
          key: forecast-history-${{ github.run_id }}
          restore-keys: forecast-history-
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
      - run: python results_feed.py
      - run: python international_data.py
      - run: python club_tables.py
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" --jq '.total_count') || count=0
            if [ "$count" = 1 ]; then exit 0; fi
            sleep 5
          done
          echo "Pages artifact did not become available in time." >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: publish
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
